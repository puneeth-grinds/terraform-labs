name: Ci Terraform 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main 

jobs:
  terraform-fmt:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: day-52
    
    steps: 
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform format
        run: terraform fmt -check

  terraform-validate:
    needs: terraform-fmt
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: day-52

    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    
      - name: install terraform 
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
      
      - name: init
        run: terraform init

      - name: validate
        run: terraform validate
      
  terraform-plan:
    runs-on: ubuntu-24.04
    needs: terrraform validate 

    defaults:
      run:
        working-directory: day-52
    
    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install terraform
        uses: hashicorp/setup-terraform@v3
      
      

